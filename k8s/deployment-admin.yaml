apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-service
  namespace: streaming-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admin-service
  template:
    metadata:
      labels:
        app: admin-service
    spec:
      containers:
        - name: admin-service
          image: yourdockerhub/admin-service:1.0
          ports:
            - containerPort: 3003