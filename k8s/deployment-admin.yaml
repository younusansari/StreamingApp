apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-service
  namespace: streaming-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admin-service
  template:
    metadata:
      labels:
        app: admin-service
    spec:
      containers:
        - name: admin-service
          image: 975050024946.dkr.ecr.us-west-1.amazonaws.com/yunus/streamingapp:admin-v1.0.15
          ports:
            - containerPort: 3003