apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: streaming-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: 975050024946.dkr.ecr.us-west-1.amazonaws.com/yunus/streamingapp:auth-v1.0.15
          ports:
            - containerPort: 3001
          env:
            - name: MONGO_URI
              value: mongodb://mongo:27017/streamingdb
            - name: NODE_ENV
              value: production